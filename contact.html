<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Hoornbeeck College</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="contact" class="hero-hoornbeeck">
        <div class="header-logo-kaart">
            <img src="img/HBC-logo.png" alt="Hoornbeeck College">
        </div>
        <div class="hero-hoornbeeck-content">
            <h1>Contact</h1>
            <p class="hero-hoornbeeck-tekst">Neem contact met ons op.</p>
            <a href="index.html" class="navigatie-item home-knop"><span>Home</span></a>
        </div>
    </header>

    <main class="pagina-indeling contact-indeling">
        <nav class="navigatie">
            <a href="Hoornbeeck.html" class="navigatie-item"><span>Hoornbeeck</span></a>
            <a href="opleidingen.html" class="navigatie-item"><span>Opleidingen</span></a>
            <a href="gallerij.html" class="navigatie-item"><span>Gallerij</span></a>
            <a href="over ons.html" class="navigatie-item"><span>Over ons</span></a>
            <a href="contact.html" class="navigatie-item"><span>Contact</span></a>
        </nav>

        <div class="pagina-inhoud">
            <div class="contact-grid">
                <section class="locaties contactgegevens">
                    <h2>Adresgegevens</h2>
                    <address class="contactgegevens-adres">
                        <strong>Lennard Knap</strong>
                        <div class="contactgegevens-link">
                            <span class="contactgegevens-icoon" aria-hidden="true">&#9742;</span>
                            <span>0630493844</span>
                        </div>
                        <a class="contactgegevens-link" href="https://outlook.office.com/mail/deeplink/compose?to=53519%40hoornbeeck.nl" target="_blank" rel="noopener noreferrer">
                            <span class="contactgegevens-icoon" aria-hidden="true">&#9993;</span>
                            <span>53519@hoornbeeck.nl</span>
                        </a>
                        <a class="contactgegevens-link" href="https://www.google.com/maps/search/?api=1&amp;query=Heetveld%2C+De+Hoogte+10%2C+Sint+Jansklooster" target="_blank" rel="noopener noreferrer">
                            <span class="contactgegevens-icoon" aria-hidden="true">&#8962;</span>
                            <span>Heetveld, De Hoogte 10<br>Sint Jansklooster</span>
                        </a>
                    </address>
                </section>
                <section class="welkom-tekst contact-form">
                    <h2>Contactformulier</h2>
                    <form>
                        <label for="naam">Naam:</label>
                        <input type="text" id="naam" required placeholder="Vul hier uw naam in">

                        <label for="email">E-mailadres</label>
                        <input type="email" id="email" required placeholder="Vul hier uw e-mailadres in">

                        <label for="bericht">Bericht</label>
                        <textarea id="bericht" rows="8" required placeholder="Vul hier uw bericht in"></textarea>

                        <button type="submit">Verstuur bericht</button>
                    </form>
                </section>
            </div>
        </div>
    </main>


    <a href="index.html#agenda" class="horizontale-tijdlijn" aria-label="Bekijk de agenda op de homepage">
        <div class="horizontaal-onderdeel">
            <time datetime="19:15">19:15</time>
            <span class="horizontale-bol"></span>
        </div>
        <div class="horizontaal-onderdeel">
            <time datetime="19:30">19:30</time>
            <span class="horizontale-bol"></span>
        </div>
        <div class="horizontaal-onderdeel">
            <time datetime="19:45">19:45</time>
            <span class="horizontale-bol"></span>
        </div>
        <div class="horizontaal-onderdeel">
            <time datetime="21:00">21:00</time>
            <span class="horizontale-bol"></span>
        </div>
    </a>

    <footer class="footer">
        <div class="footer-logo">
            <img src="img/HBC-logo.png" alt="Hoornbeeck College">
        </div>
        <div class="footer-contact">
            <span>Lennard Knap</span>
            <span class="contact-item">53519@hoornbeeck.nl</span>
            <span class="contact-item">06 30493844</span>
        </div>
    </footer>
</body>
</html>
