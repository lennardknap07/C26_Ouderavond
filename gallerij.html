    <script>
        const fotoKnoppen = document.querySelectorAll(".gallerij-foto");
        const zoomvenster = document.querySelector(".zoomvenster");
        const zoomAfbeelding = document.querySelector(".zoom-afbeelding");
        const zoomSluiten = document.querySelector(".zoom-sluiten");
        let actieveFotoKnop;

        function sluitZoom() {
            zoomvenster.classList.remove("is-open");
            zoomvenster.setAttribute("aria-hidden", "true");
            actieveFotoKnop?.focus();
        }

        fotoKnoppen.forEach((knop) => {
            knop.addEventListener("click", () => {
                const afbeelding = knop.querySelector("img");
                actieveFotoKnop = knop;
                zoomAfbeelding.src = afbeelding.src;
                zoomAfbeelding.alt = afbeelding.alt;
                zoomvenster.classList.add("is-open");
                zoomvenster.setAttribute("aria-hidden", "false");
                zoomSluiten.focus();
            });
        });

        zoomSluiten.addEventListener("click", sluitZoom);
        zoomvenster.addEventListener("click", (event) => {
            if (event.target === zoomvenster) {
                sluitZoom();
            }
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                sluitZoom();
            }
        });
    </script>
